[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwf"
version = "0.1.0"
description = "AI workflow engine: schema-driven JSON workflows, audited runs, CLI + agent skills"
readme = { text = "Run engine/bin/aiwf, or see skills/ for agent usage.", content-type = "text/plain" }
requires-python = ">=3.9"
license = { "text" = "MIT" }
dependencies = [
    "jsonschema>=4.0",
]

[project.scripts]
aiwf = "aiwf.cli:main"

[tool.setuptools]
package-dir = { "" = "engine" }

[tool.setuptools.packages.find]
where = ["engine"]

# Runtime data the CLI resolves from the installation prefix. The source
# checkout keeps the canonical copies; the loaders check it first, then these
# installed locations.
[tool.setuptools.data-files]
"share/aiwf/schemas" = ["schemas/*.json"]
"share/aiwf/library" = ["library/INDEX.md"]
"share/aiwf/library/workflows" = ["library/workflows/*.json"]
"share/aiwf/library/meta" = ["library/meta/*.json"]
"share/aiwf/skills/aiwf" = ["skills/aiwf/SKILL.md", "skills/aiwf/RUN-CARD.md", "skills/aiwf/TROUBLESHOOT.md"]
"share/aiwf/skills/aiwf/references" = ["skills/aiwf/references/*.md"]
"share/aiwf/skills/aiwf/assets/examples" = ["skills/aiwf/assets/examples/*.json"]
